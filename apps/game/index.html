<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moxi</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      [role="status"] {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 2rem;
        font: 16px system-ui;
        pointer-events: none;
        background: #000;
      }
      #hub-root {
        position: fixed;
        inset: 0;
        z-index: 2;
        isolation: isolate;
        pointer-events: none;
      }
      #hub-root > * {
        pointer-events: auto;
      }
      [hidden] {
        display: none;
      }
      /* The client focuses these fields to read text. They sit behind the canvas, not hidden:
         focus() fails on display:none and the glue gives up. */
      .osk-input-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: -1;
      }
      .osk-input {
        width: 80%;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="960" height="640" tabindex="0" aria-label="Guild Wars"></canvas>
    <div class="osk-input-container">
      <input
        type="text"
        id="osk-input-text"
        class="osk-input"
        tabindex="-1"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <input
        type="email"
        id="osk-input-email"
        class="osk-input"
        tabindex="-1"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <input
        type="password"
        id="osk-input-password"
        class="osk-input"
        tabindex="-1"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <input
        type="number"
        id="osk-input-number"
        class="osk-input"
        tabindex="-1"
        autocomplete="off"
      />
      <textarea
        id="osk-input-multiline"
        class="osk-input"
        rows="3"
        tabindex="-1"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      ></textarea>
    </div>
    <div role="status">Starting Guild Wars…</div>
    <div id="hub-root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
