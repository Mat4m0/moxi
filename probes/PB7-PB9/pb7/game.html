<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PB7-GAME</title>
    <style>
      body { font: 12px system-ui, sans-serif; margin: 8px; background: #101114; color: #d8dbe2; }
      canvas { display: block; background: #181a20; }
      #hud { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin-top: 6px; }
      #hud span { white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <canvas id="world" width="640" height="120"></canvas>
    <div id="hud"></div>
    <script src="game.js"></script>
  </body>
</html>
