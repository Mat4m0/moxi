name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Hub suite runs in Vitest browser mode on Playwright's Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps chromium
      # Ubuntu blocks the unprivileged user namespaces Chromium's sandbox needs; the e2e runs sandboxed.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .evidence/
          include-hidden-files: true
          retention-days: 7
