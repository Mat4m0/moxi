name: probe-PB3

on:
  pull_request:
    paths: ["probes/PB3/**", ".github/workflows/probe-PB3.yml"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps chromium
      - name: Allow the Chromium sandbox (unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run PB3 (Electron, hidden windows, loopback listeners)
        run: xvfb-run --auto-servernum pnpm exec electron probes/PB3/main.cjs
        env:
          PB3_OUT: ${{ github.workspace }}/pb3-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pb3-linux
          path: pb3-out/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run PB3 (Electron, hidden windows, loopback listeners)
        run: pnpm exec electron probes/PB3/main.cjs
        env:
          PB3_OUT: ${{ github.workspace }}/pb3-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pb3-windows
          path: pb3-out/
          if-no-files-found: warn
